services:
  - type: web
    name: versao-java-conselho
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/dados
    envVars:
      - key: PORT
        value: "10000"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: "bamorimfragozo-png/versao-java-conselho"
      - key: GITHUB_BRANCH
        value: "main"
